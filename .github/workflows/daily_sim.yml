name: Daily ETF Simulation Tracker

on:
  schedule:
    - cron: "30 8 * * 1-5" # 월~금 08:30 UTC = 17:30 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet pandas numpy yfinance

      - name: Run daily simulation
        run: python run_sim.py

      - name: Commit and push updated log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/etf_sim_log.csv summary.md
          git diff --staged --quiet || git commit -m "chore: update daily ETF simulation log"
          git push
